name: Publish project page

on:
  push:
    branches: [sjc]
    paths:
      - 'project-page/dist/**'
      - '.github/workflows/project-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static project page
        uses: actions/upload-pages-artifact@v4
        with:
          path: project-page/dist
      - name: Deploy project page
        id: deployment
        uses: actions/deploy-pages@v4
